<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121212" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Expense Tracker</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #121212;
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #121212;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      .boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-loader__mark {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        border: 2px solid rgba(212, 255, 55, 0.45);
        overflow: hidden;
        background: #121212;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-loader__mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.88;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" aria-busy="true" aria-live="polite">
      <div class="boot-loader__mark">
        <img src="/logo-icon.png" alt="Expense Tracker" width="96" height="96" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
